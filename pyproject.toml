[project]
name = "fast-video-editor"
version = "0.2.0"
description = "FFmpeg-first Python video editor"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-qt>=4.4",
]
dev = [
    "ruff>=0.11",
]

[project.scripts]
video-editor = "video_editor.__main__:main"

[tool.uv]
# Windows Application Control blocks uv's unsigned managed Python builds;
# always build the venv on the signed system-installed CPython instead.
python-preference = "only-system"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_editor = ["assets/*.png", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
markers = [
    "ffmpeg: integration tests that require ffmpeg and ffprobe",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
